name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity 連携に必須
    steps:
      - uses: actions/checkout@v4

      # package.json の engines.node を参照するため、
      # Node.js のバージョン更新時にワークフローの修正が不要になる
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'yarn'

      # postinstall で firebase-cloud-functions 側の依存も入る
      # （firebase.json の predeploy で eslint が走るため必要）
      - name: yarn install
        run: yarn install --frozen-lockfile

      - name: run lint
        run: yarn lint

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: fir-cloud-functions-trial
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # GOOGLE_APPLICATION_CREDENTIALS を firebase CLI に渡すため
          create_credentials_file: true
          export_environment_variables: true

      # --force は Artifact Registry のクリーンアップポリシー設定の確認をスキップするために必要
      # （未設定の場合、--non-interactive だけだとデプロイ成功後にエラー終了してしまう）
      # デフォルトの保持期間（1日）でポリシーが自動設定される
      - name: deploy functions
        run: npx firebase deploy --only functions --project fir-cloud-functions-trial --non-interactive --force
